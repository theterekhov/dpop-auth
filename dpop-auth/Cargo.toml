[package]
name = "dpop-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "DPoP (RFC 9449) authentication library for Axum"
license.workspace = true
keywords = ["dpop", "auth", "axum", "oauth", "jwt"]
categories = ["authentication", "web-programming::http-server"]
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
cookie = ["dep:axum-extra", "dep:time"]
postgres = ["dep:sqlx", "dep:chrono", "dep:argon2", "dep:getrandom"]

[dependencies]
jsonwebtoken.workspace = true
sha2.workspace = true
base64ct.workspace = true
hex.workspace = true
thiserror.workspace = true
moka.workspace = true
url.workspace = true
uuid.workspace = true
serde.workspace = true
tracing.workspace = true
subtle.workspace = true
serde_json.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
tokio.workspace = true
sqlx = { workspace = true, optional = true}
chrono = { workspace = true, optional = true}
axum-extra = {workspace = true, optional = true}
argon2 = {workspace = true, optional = true}
getrandom = {workspace = true, optional = true}
time = {workspace = true, optional = true}

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdsa"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["trace"] }
