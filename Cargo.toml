[workspace]
resolver = "3"
members = ["dpop-auth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theterekhov/dpop-auth"

[workspace.dependencies]
sha2 = "0.11.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
hex = "0.4.3"
thiserror = "2.0.20"
moka = { version = "0.12.16", features = ["future"] }
url = "2.5.8"
tracing = "0.1.44"
subtle = "2.6.1"
uuid = { version = "1.25.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
